site_name: Revfore Framework Docs
site_description: Documentation for Revfore Framework
site_url: https://docs.revfore.com/revfore-framework/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Setup & Installation: setup/setup.md
  - Core Concepts:
      - Relational Tables: concepts/tables.md
      - Relational Models: concepts/models.md
      - Relational Views: concepts/views.md
      - Metadata-Driven UI:
          - Overview: concepts/metadataDrivenUI/index.md
          - Actions: concepts/metadataDrivenUI/actions.md
          - Content Item: concepts/metadataDrivenUI/contentItem.md
          - Content Sub Item:
              - Overview: concepts/metadataDrivenUI/contentSubItem/index.md          
              - Custom Adapter Dashboard: concepts/metadataDrivenUI/contentSubItem/customAdapterDashboard.md
              - Dyanamic Grid: concepts/metadataDrivenUI/contentSubItem/dynamicGrid.md                   
              - List: concepts/metadataDrivenUI/contentSubItem/list.md
              - Pivot Grid: concepts/metadataDrivenUI/contentSubItem/pivotGrid.md
              - Summary Card: concepts/metadataDrivenUI/contentSubItem/summaryCard.md                            
  - Application Groups:
      - Config:
          - Overview: appGroups/config/index.md
          - Manage License Keys: appGroups/config/manage-license-key.md   
          - Setup & Upgrade: appGroups/config/setup-upgrade.md      
          - Uninstall: appGroups/config/uninstall.md
          - Run Maintenance Scripts: appGroups/config/run-maintenance-scripts.md
          - Other: appGroups/config/other.md  
      - Admin:
          - Overview: appGroups/admin/index.md
          - Security:
              - Users: appGroups/admin/security/Users/index.md
              - Groups: appGroups/admin/security/Groups/index.md          
          - Relational:
            - Database:
                - Overview: appGroups/admin/relational/database/index.md
                - Tables: appGroups/admin/relational/database/tables.md
                - Views: appGroups/admin/relational/database/views.md
            - Relational Tables:
                - Overview: appGroups/admin/relational/relationalTables/index.md
                - Tables: appGroups/admin/relational/relationalTables/tables.md
                - Columns: appGroups/admin/relational/relationalTables/columns.md
                - Indexes: appGroups/admin/relational/relationalTables/indexes.md
                - Relationships: appGroups/admin/relational/relationalTables/relationships.md
            - Relational Models:
                - Overview: appGroups/admin/relational/relationalModels/index.md
                - Models: appGroups/admin/relational/relationalModels/models.md              
                - Sources: appGroups/admin/relational/relationalModels/sources.md
                - Columns: appGroups/admin/relational/relationalModels/columns.md
                - Relationships: appGroups/admin/relational/relationalModels/relationships.md
            - Relational Views:
                - Overview: appGroups/admin/relational/relationalViews/index.md
                - Views: appGroups/admin/relational/relationalViews/views.md              
                - Security: appGroups/admin/relational/relationalViews/security.md                            
                - Columns: appGroups/admin/relational/relationalViews/columns.md
                - Actions: appGroups/admin/relational/relationalViews/actions.md
                - Filters: appGroups/admin/relational/relationalViews/filters.md
            - Supporting:
                - Overview: appGroups/admin/relational/supporting/index.md
                - Standard Columns: appGroups/admin/relational/supporting/standardColumns.md
                - Lookups: appGroups/admin/relational/supporting/lookups.md
                - Cube Views: appGroups/admin/relational/supporting/cubeViews.md
                - Forms: appGroups/admin/relational/supporting/forms.md
          - Cube:
              - Cubes:
                  - Cubes: appGroups/admin/cube/cubes/index.md
              - Dimensions:
                  - Dimension Members: appGroups/admin/cube/dimensions/index.md
              - Supporting:
                  - Dimension Types: appGroups/admin/cube/supporting/index.md
          - Workflow:
              - Units:
                  - Overview: appGroups/admin/workflow/units/index.md
                  - Units: appGroups/admin/workflow/units/units.md
                  - Member Sets: appGroups/admin/workflow/units/memberSets.md
              - Instances:
                  - Overview: appGroups/admin/workflow/instances/index.md
                  - Instances: appGroups/admin/workflow/instances/instances.md
                  - Instance Types: appGroups/admin/workflow/instances/instanceTypes.md
              - Areas: appGroups/admin/workflow/areas/index.md
              - Supporting:
                  - Overview: appGroups/admin/workflow/supporting/index.md
                  - Member Set Types: appGroups/admin/workflow/supporting/memberSetTypes.md
                  - Item Categories: appGroups/admin/workflow/supporting/itemCategories.md
                  - Item Categories - Member Sets: appGroups/admin/workflow/supporting/itemCategoryMemberSets.md
                  - Item Types: appGroups/admin/workflow/supporting/itemTypes.md
                  - Item Types - Workflow Areas: appGroups/admin/workflow/supporting/itemTypeAreas.md
                  - Item Types - Item Categories: appGroups/admin/workflow/supporting/itemTypeItemCategories.md
      - Home: appGroups/home/index.md
      - Help: appGroups/help/index.md
  - Integrations: 
      - AI Models:
          - Overview: integrations/aiModels/index.md
      - Genesis:
          - Overview: integrations/genesis/index.md
      - Custom Dashboard:
          - Overview: integrations/customDashboard/index.md
      - Partner Solution:          
          - Overview: integrations/partnerSolution/index.md      
      - Excel:
          - Overview: integrations/excel/index.md
      - REST APIs:
          - Overview: integrations/restAPIs/index.md

# Working notes and drafts - excluded from the build entirely, so they are not
# published. docs/misc/ is also gitignored.
exclude_docs: |
  misc/*

plugins:
  - search
  - mike:
      deploy_prefix: revfore-framework
      alias_type: copy

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

copyright: Copyright © 2026 Revfore
